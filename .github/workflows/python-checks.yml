name: Python checks

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile application and tests
        run: python -m compileall -q app.py services tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
